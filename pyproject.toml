[project]
name = "resume-analyzer"
version = "0.1.0"
description = "Two-stage Resume Analyzer using TypeSafe and Groq"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "typesafe-sdk>=0.7.0",
    "groq>=0.11.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "olefile>=0.47",
]

[tool.vercel]
entrypoint = "backend.main:app"
